services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models/dacl10k_tiny_unet.pt
      MODEL_VERSION: dacl10k-baseline
    volumes:
      - ./models:/app/models
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
