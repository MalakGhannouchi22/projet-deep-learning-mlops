[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-skin"
version = "0.1.0"
description = "Urban infrastructure damage perception and decision support"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9,<1",
    "pillow>=10,<12",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
ml = [
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "onnxruntime>=1.18,<2",
    "mlflow>=2.15,<3",
    "dvc>=3.50,<4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
